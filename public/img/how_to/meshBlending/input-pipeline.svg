<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Mesh blending input pipeline</title>
  <desc id="desc">SceneColor, packed mesh tags, depth, and optional linear albedo feed the mesh blending post-process, which produces blended SceneColor.</desc>
  <defs>
    <linearGradient id="scene" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f80ed"/>
      <stop offset="1" stop-color="#56ccf2"/>
    </linearGradient>
    <linearGradient id="effect" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c4bf4"/>
      <stop offset="1" stop-color="#9b51e0"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#4a5568"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1a202c" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1200" height="520" rx="24" fill="#f7f8fc"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#20253a">Screen-space mesh blending pipeline</text>

  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="55" y="90" width="270" height="80" rx="14" fill="url(#scene)"/>
    <text x="190" y="124" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">SceneColor</text>
    <text x="190" y="151" text-anchor="middle" font-size="16" fill="#fff">Rendered opaque scene</text>

    <rect x="55" y="195" width="270" height="80" rx="14" fill="#fff" stroke="#f2994a" stroke-width="4"/>
    <text x="190" y="229" text-anchor="middle" font-size="22" font-weight="700" fill="#20253a">Packed mesh tags</text>
    <text x="190" y="255" text-anchor="middle" font-size="16" fill="#4a5568">R8UI group + radius class</text>

    <rect x="55" y="300" width="270" height="80" rx="14" fill="#fff" stroke="#27ae60" stroke-width="4"/>
    <text x="190" y="334" text-anchor="middle" font-size="22" font-weight="700" fill="#20253a">Depth</text>
    <text x="190" y="360" text-anchor="middle" font-size="16" fill="#4a5568">View or screen representation</text>

    <rect x="55" y="405" width="270" height="80" rx="14" fill="#fff" stroke="#9b51e0" stroke-width="4" stroke-dasharray="10 8"/>
    <text x="190" y="439" text-anchor="middle" font-size="22" font-weight="700" fill="#20253a">Linear albedo</text>
    <text x="190" y="465" text-anchor="middle" font-size="16" fill="#4a5568">Optional shadow attenuation</text>

    <rect x="470" y="180" width="290" height="220" rx="24" fill="url(#effect)"/>
    <text x="615" y="236" text-anchor="middle" font-size="27" font-weight="700" fill="#fff">Mesh blending</text>
    <text x="615" y="274" text-anchor="middle" font-size="17" fill="#fff">Boundary search</text>
    <text x="615" y="305" text-anchor="middle" font-size="17" fill="#fff">Contact validation</text>
    <text x="615" y="336" text-anchor="middle" font-size="17" fill="#fff">Target color construction</text>
    <text x="615" y="367" text-anchor="middle" font-size="17" fill="#fff">Distance-based fade</text>

    <rect x="900" y="235" width="245" height="110" rx="18" fill="url(#scene)"/>
    <text x="1022" y="278" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">Blended</text>
    <text x="1022" y="309" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">SceneColor</text>
  </g>

  <g fill="none" stroke="#4a5568" stroke-width="4" marker-end="url(#arrow)">
    <path d="M325 130 C405 130 410 220 470 235"/>
    <path d="M325 235 H470"/>
    <path d="M325 340 C405 340 410 305 470 300"/>
    <path d="M325 445 C405 445 410 370 470 360" stroke-dasharray="10 8"/>
    <path d="M760 290 H900"/>
  </g>

  <text x="365" y="421" font-family="Arial, sans-serif" font-size="15" fill="#6b7280">optional</text>
  <text x="600" y="498" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#4a5568">All connected textures must have matching physical dimensions and sample coverage.</text>
</svg>
