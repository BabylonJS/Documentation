<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Default mesh blending radius classes</title>
  <desc id="desc">Four panels compare the default Small, Medium, Large, and Extra Large mesh blending radius definitions.</desc>
  <defs>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f6fd2"/>
      <stop offset="1" stop-color="#56ccf2"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2c94c"/>
      <stop offset="1" stop-color="#e67e22"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1a202c" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1200" height="500" rx="24" fill="#f7f8fc"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#20253a">Default radius classes</text>

  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(35 88)">
      <rect width="265" height="350" rx="18" fill="#fff"/>
      <text x="132.5" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#20253a">Small</text>
      <text x="132.5" y="68" text-anchor="middle" font-size="16" fill="#6b7280">0.06 world units · 1.5 px min</text>
      <path d="M28 260 Q78 150 138 260 Z" fill="url(#left)"/>
      <path d="M126 260 Q186 145 237 260 Z" fill="url(#right)"/>
      <path d="M120 252 Q132 236 144 252" fill="none" stroke="#8b5cf6" stroke-width="8" stroke-linecap="round"/>
      <line x1="120" y1="293" x2="144" y2="293" stroke="#8b5cf6" stroke-width="4"/>
      <path d="M120 286 v14 M144 286 v14" stroke="#8b5cf6" stroke-width="3"/>
      <text x="132.5" y="327" text-anchor="middle" font-size="15" fill="#4a5568">Small props and tight seams</text>
    </g>

    <g transform="translate(325 88)">
      <rect width="265" height="350" rx="18" fill="#fff"/>
      <text x="132.5" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#20253a">Medium</text>
      <text x="132.5" y="68" text-anchor="middle" font-size="16" fill="#6b7280">0.10 world units · 3 px min</text>
      <path d="M28 260 Q78 150 138 260 Z" fill="url(#left)"/>
      <path d="M126 260 Q186 145 237 260 Z" fill="url(#right)"/>
      <path d="M112 252 Q132 224 152 252" fill="none" stroke="#8b5cf6" stroke-width="12" stroke-linecap="round"/>
      <line x1="108" y1="293" x2="156" y2="293" stroke="#8b5cf6" stroke-width="4"/>
      <path d="M108 286 v14 M156 286 v14" stroke="#8b5cf6" stroke-width="3"/>
      <text x="132.5" y="327" text-anchor="middle" font-size="15" fill="#4a5568">Balanced default contacts</text>
    </g>

    <g transform="translate(615 88)">
      <rect width="265" height="350" rx="18" fill="#fff"/>
      <text x="132.5" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#20253a">Large</text>
      <text x="132.5" y="68" text-anchor="middle" font-size="16" fill="#6b7280">0.20 world units · 3 px min</text>
      <path d="M28 260 Q78 150 138 260 Z" fill="url(#left)"/>
      <path d="M126 260 Q186 145 237 260 Z" fill="url(#right)"/>
      <path d="M98 252 Q132 203 166 252" fill="none" stroke="#8b5cf6" stroke-width="16" stroke-linecap="round"/>
      <line x1="92" y1="293" x2="172" y2="293" stroke="#8b5cf6" stroke-width="4"/>
      <path d="M92 286 v14 M172 286 v14" stroke="#8b5cf6" stroke-width="3"/>
      <text x="132.5" y="327" text-anchor="middle" font-size="15" fill="#4a5568">Large rocks and terrain pieces</text>
    </g>

    <g transform="translate(905 88)">
      <rect width="265" height="350" rx="18" fill="#fff"/>
      <text x="132.5" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#20253a">Extra Large</text>
      <text x="132.5" y="68" text-anchor="middle" font-size="16" fill="#6b7280">0.30 world units · 5 px min</text>
      <path d="M28 260 Q78 150 138 260 Z" fill="url(#left)"/>
      <path d="M126 260 Q186 145 237 260 Z" fill="url(#right)"/>
      <path d="M82 252 Q132 180 182 252" fill="none" stroke="#8b5cf6" stroke-width="20" stroke-linecap="round"/>
      <line x1="74" y1="293" x2="190" y2="293" stroke="#8b5cf6" stroke-width="4"/>
      <path d="M74 286 v14 M190 286 v14" stroke="#8b5cf6" stroke-width="3"/>
      <text x="132.5" y="327" text-anchor="middle" font-size="15" fill="#4a5568">Broad authored contacts</text>
    </g>
  </g>

  <text x="600" y="472" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#4a5568">The effective radius is the projected world radius or the minimum physical-pixel radius, whichever is larger, scaled by quality.</text>
</svg>
