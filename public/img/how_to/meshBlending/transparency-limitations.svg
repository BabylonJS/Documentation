<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Transparency interaction with mesh blending</title>
  <desc id="desc">A safe case shows transparent content away from participating contacts. An unsafe case shows transparent surfaces overlapping the contact and disagreeing with single-layer geometry textures.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0 H0 V24" fill="none" stroke="#dfe3ec" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1a202c" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1200" height="520" rx="24" fill="#f7f8fc"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#20253a">Transparent content must remain consistent with single-layer geometry inputs</text>

  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(70 90)">
      <rect width="500" height="355" rx="20" fill="#fff"/>
      <rect x="28" y="82" width="444" height="210" rx="14" fill="url(#grid)"/>
      <path d="M70 270 Q155 125 240 270 Z" fill="#2d9cdb"/>
      <path d="M180 270 Q265 135 350 270 Z" fill="#f2994a"/>
      <path d="M365 115 L445 115 L425 205 L385 205 Z" fill="#56ccf2" fill-opacity=".42" stroke="#2d9cdb" stroke-width="3"/>
      <path d="M180 257 Q210 220 242 257" fill="none" stroke="#6c4bf4" stroke-width="12" stroke-linecap="round"/>
      <circle cx="55" cy="43" r="17" fill="#27ae60"/>
      <path d="M47 43 l6 6 l11 -13" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="88" y="51" font-size="23" font-weight="700" fill="#20253a">Safe: screen-space disjoint</text>
      <text x="250" y="325" text-anchor="middle" font-size="16" fill="#4a5568">Transparent content does not cover the participating contact.</text>
    </g>

    <g transform="translate(630 90)">
      <rect width="500" height="355" rx="20" fill="#fff"/>
      <rect x="28" y="82" width="444" height="210" rx="14" fill="url(#grid)"/>
      <path d="M70 270 Q155 125 240 270 Z" fill="#2d9cdb"/>
      <path d="M180 270 Q265 135 350 270 Z" fill="#f2994a"/>
      <path d="M125 110 L390 110 L350 260 L165 260 Z" fill="#56ccf2" fill-opacity=".42" stroke="#2d9cdb" stroke-width="3"/>
      <path d="M170 245 Q212 205 255 245" fill="none" stroke="#eb5757" stroke-width="12" stroke-linecap="round" stroke-dasharray="10 8"/>
      <circle cx="55" cy="43" r="17" fill="#eb5757"/>
      <path d="M48 36 l14 14 M62 36 L48 50" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <text x="88" y="51" font-size="23" font-weight="700" fill="#20253a">Unsafe: overlapping layers</text>
      <text x="250" y="317" text-anchor="middle" font-size="16" fill="#4a5568">SceneColor can contain blended transparency while depth,</text>
      <text x="250" y="339" text-anchor="middle" font-size="16" fill="#4a5568">tag, and albedo still describe only one surface.</text>
    </g>
  </g>

  <text x="600" y="486" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#4a5568">Recommended general order: render opaque and alpha-tested content → mesh blending → transparent composition.</text>
</svg>
