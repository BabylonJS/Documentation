<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Right-handed and left-handed coordinate systems</title>
  <desc id="desc">Two coordinate systems with positive X pointing right and positive Y pointing up. Positive Z points toward the viewer in the right-handed system and away from the viewer in the left-handed system.</desc>
  <defs>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d33"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#198754"/>
    </marker>
    <style>
      .panel { fill: #f8f9fa; stroke: #adb5bd; stroke-width: 2; }
      .heading { font: 700 26px Arial, sans-serif; fill: #212529; text-anchor: middle; }
      .label { font: 20px Arial, sans-serif; fill: #212529; }
      .axis-label { font: 700 20px Arial, sans-serif; }
      .note { font: 18px Arial, sans-serif; fill: #495057; text-anchor: middle; }
      .origin { fill: #212529; }
      .z-ring { fill: none; stroke: #0d6efd; stroke-width: 4; }
      .z-mark { stroke: #0d6efd; stroke-width: 4; stroke-linecap: round; }
    </style>
  </defs>

  <rect class="panel" x="20" y="20" width="450" height="380" rx="12"/>
  <rect class="panel" x="490" y="20" width="450" height="380" rx="12"/>

  <text class="heading" x="245" y="65">Right-handed</text>
  <text class="heading" x="715" y="65">Left-handed</text>

  <line x1="190" y1="285" x2="355" y2="285" stroke="#d33" stroke-width="5" marker-end="url(#arrow-red)"/>
  <line x1="190" y1="285" x2="190" y2="120" stroke="#198754" stroke-width="5" marker-end="url(#arrow-green)"/>
  <circle class="origin" cx="190" cy="285" r="6"/>
  <text class="axis-label" x="365" y="292" fill="#d33">+X</text>
  <text class="axis-label" x="174" y="108" fill="#198754">+Y</text>
  <circle class="z-ring" cx="190" cy="285" r="33"/>
  <circle cx="190" cy="285" r="7" fill="#0d6efd"/>
  <text class="axis-label" x="118" y="350" fill="#0d6efd">+Z toward you</text>
  <text class="note" x="245" y="382">X cross Y = Z</text>

  <line x1="660" y1="285" x2="825" y2="285" stroke="#d33" stroke-width="5" marker-end="url(#arrow-red)"/>
  <line x1="660" y1="285" x2="660" y2="120" stroke="#198754" stroke-width="5" marker-end="url(#arrow-green)"/>
  <circle class="origin" cx="660" cy="285" r="6"/>
  <text class="axis-label" x="835" y="292" fill="#d33">+X</text>
  <text class="axis-label" x="644" y="108" fill="#198754">+Y</text>
  <circle class="z-ring" cx="660" cy="285" r="33"/>
  <line class="z-mark" x1="648" y1="273" x2="672" y2="297"/>
  <line class="z-mark" x1="672" y1="273" x2="648" y2="297"/>
  <text class="axis-label" x="588" y="350" fill="#0d6efd">+Z away from you</text>
  <text class="note" x="715" y="382">X cross Y = -Z</text>
</svg>
